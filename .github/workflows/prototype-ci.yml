name: Prototype CI

on:
  push:
    paths:
      - "NEURAL_ORCHESTRATION/**"
      - ".github/workflows/prototype-ci.yml"
  pull_request:
    paths:
      - "NEURAL_ORCHESTRATION/**"
      - ".github/workflows/prototype-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run prototype tests
        run: python -m pytest NEURAL_ORCHESTRATION/tests -q
